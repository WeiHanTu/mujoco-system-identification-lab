name: CPU SysID smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: artifacts/matplotlib
      XDG_CACHE_HOME: artifacts/cache
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.5"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.10
      - name: Restore locked environment
        id: dependencies
        run: uv sync --locked --python 3.12.5
      - name: Contract tests
        run: |
          mkdir -p artifacts/ci
          .venv/bin/python -m pytest 2>&1 | tee artifacts/ci/pytest.log
      - name: Build wheel and source distribution
        if: always() && steps.dependencies.outcome == 'success'
        run: uv build --python .venv/bin/python --out-dir artifacts/ci/dist
      - name: One-seed CPU smoke
        if: always() && steps.dependencies.outcome == 'success'
        run: .venv/bin/python scripts/run_smoke.py --config configs/smoke_v1.json --output artifacts/ci/smoke
      - name: Retain smoke evidence and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
