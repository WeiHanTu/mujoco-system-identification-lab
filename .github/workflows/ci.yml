name: CPU SysID smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
      MPLCONFIGDIR: artifacts/matplotlib
      XDG_CACHE_HOME: artifacts/cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Python 3.12.5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12.5"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.10
      - name: Restore locked environment
        id: dependencies
        run: uv sync --locked --python 3.12.5
      - name: Contract tests
        run: |
          mkdir -p artifacts/ci
          .venv/bin/python -m pytest 2>&1 | tee artifacts/ci/pytest.log
      - name: Build wheel and source distribution
        if: always() && steps.dependencies.outcome == 'success'
        run: uv build --python .venv/bin/python --out-dir artifacts/ci/dist
      - name: One-seed CPU smoke
        if: always() && steps.dependencies.outcome == 'success'
        run: .venv/bin/python scripts/run_smoke.py --config configs/smoke_v1.json --output artifacts/ci/smoke
      - name: Retain smoke evidence and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: cpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
